<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de actividades</title>
<!-- Librerías (versiones fijadas). Solo se descarga el código de las librerías; tus datos nunca salen del navegador. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fb;--panel:#ffffff;--text:#1f2937;--muted:#5b6472;--border:#e2e6ec;--accent:#2563eb;--accent-text:#ffffff;--good:#166534;--good-bg:#dcfce7;--bad:#991b1b;--bad-bg:#fee2e2;--grid:rgba(0,0,0,.08);--hm0:#e9edf2;--hm1:#c6dbfb;--hm2:#8fb6f6;--hm3:#4f86ee;--hm4:#1d4ed8;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0f172a;--panel:#1e293b;--text:#e5e7eb;--muted:#a3adbb;--border:#334155;--accent:#60a5fa;--accent-text:#0f172a;--good:#86efac;--good-bg:#14532d;--bad:#fca5a5;--bad-bg:#7f1d1d;--grid:rgba(255,255,255,.1);--hm0:#273449;--hm1:#1e3a8a;--hm2:#1d4ed8;--hm3:#3b82f6;--hm4:#93c5fd;--shadow:none}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
header{background:var(--panel);color:var(--text);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button:focus-visible,.btn:focus-within,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.btn{position:relative}
select,input[type=date],input[type=number],input[type=text],input[type=search]{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
.filters label{display:flex;gap:6px;align-items:center}
#status{color:var(--muted);font-size:13px;margin-left:auto}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:10px 20px 0}
nav button{border-radius:8px 8px 0 0;border-bottom:none}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
main{padding:16px 20px 40px}
.card{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:16px}
.card h4{margin:0 0 6px;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-top:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:22px;font-weight:650;margin-top:2px}
.kpi .s{color:var(--muted);font-size:12px}
h2.sec{font-size:16px;margin:20px 0 10px}
h2.sec small{font-weight:400;color:var(--muted)}
.chart{position:relative;height:280px}
.chart.sm-h{height:190px}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted);margin-top:10px}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);z-index:1}
th button{border:none;padding:0;background:none;font-weight:650}
td.num,th.num{text-align:right}
tr.excluded td{opacity:.45;text-decoration:line-through}
tr.excluded td:first-child,tr.excluded td:nth-child(2){text-decoration:none;opacity:1}
td.best{background:var(--good-bg);color:var(--good);font-weight:650}
td.good{color:var(--good);font-weight:600}
td.bad{color:var(--bad);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.grid-cmp{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:14px;align-items:start}
@media (max-width:900px){.grid-cmp{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
.picklist{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin:8px 0;padding:4px}
.picklist label{display:flex;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13.5px}
.picklist label:hover{background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row label[hidden]{display:none}
.row label input,.row label select{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font-size:13px;padding:5px 10px;border-radius:999px}
.progress{height:14px;border-radius:999px;background:var(--bg);border:1px solid var(--border);overflow:hidden;margin:6px 0}
.progress>div{height:100%;background:var(--accent)}
.progress.ok>div{background:#16a34a}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.badge.ok{background:var(--good-bg);color:var(--good)}
.badge.ko{background:var(--bad-bg);color:var(--bad)}
:root{--warn:#92400e;--warn-bg:#fef3c7}
[data-theme="dark"]{--warn:#fcd34d;--warn-bg:#78350f}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.feas{list-style:none;padding:0;margin:10px 0}
.feas li{display:flex;gap:8px;align-items:baseline;margin:6px 0;font-size:13.5px}
.feas li .badge{flex:none}
.weekbox{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
tr.curwk td{background:var(--bg);font-weight:600}
td.wrap{white-space:normal;min-width:240px}
details>summary{cursor:pointer;color:var(--accent);margin:10px 0 6px;font-size:14px}
.hm-wrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.hm-days{display:grid;grid-template-rows:repeat(7,15px);gap:3px;font-size:10px;color:var(--muted)}
.hm-grid{display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;grid-auto-columns:15px;gap:3px}
.hm{border-radius:3px;background:var(--hm0)}
.hm.l1{background:var(--hm1)}.hm.l2{background:var(--hm2)}.hm.l3{background:var(--hm3)}.hm.l4{background:var(--hm4)}
.hm.out{background:transparent}
.legend{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.legend .hm{width:12px;height:12px;display:inline-block}
.welcome{max-width:720px;margin:30px auto;text-align:center;padding:30px}
.welcome h2{margin-top:0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;max-width:640px;width:92vw;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mlist{columns:2;column-gap:20px;max-height:55vh;overflow:auto;margin:10px 0}
.mlist label{display:flex;gap:8px;padding:3px 0;break-inside:avoid;font-size:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}
.zt td{padding:4px 8px}
textarea{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;width:100%}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#co-prompt{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;min-height:360px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
#drop{position:fixed;inset:0;background:rgba(37,99,235,.15);border:4px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--text);z-index:30}
#drop.on{display:flex}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* Calendario propio: semana de lunes a domingo (el del navegador depende del idioma de Windows) */
input[type=date]{cursor:pointer}
input[type=date]::-webkit-calendar-picker-indicator{display:none}
.dp{position:absolute;z-index:40;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:10px;width:264px;font-size:14px}
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.dp-head strong{text-transform:capitalize}
.dp-head button{padding:3px 10px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-grid .dow{color:var(--muted);font-size:12px;font-weight:600;padding:3px 0}
.dp-grid button{padding:5px 0;justify-content:center;border-color:transparent;border-radius:6px;background:var(--panel);color:var(--text)}
.dp-grid button.out{color:var(--muted)}
.dp-grid button.today{border-color:var(--accent)}
.dp-grid button.sel{background:var(--accent);color:var(--accent-text)}
.dp-grid button:disabled{opacity:.35;cursor:not-allowed}
.dp-foot{display:flex;justify-content:space-between;margin-top:8px}
.dp-foot button{padding:4px 10px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>🏃 Panel de actividades</h1>
  <div class="actions">
    <label class="btn primary" for="f-file">📂 Cargar Excel / CSV<input type="file" id="f-file" accept=".csv,.xlsx,.xls,.xlsm,.ods,text/csv" multiple></label>
    <label class="btn" for="f-laps" title="CSV de vueltas/series de UNA actividad (Garmin Connect → abre la actividad → ⚙️ → Exportar a CSV)">⏱️ Cargar series de una actividad<input type="file" id="f-laps" accept=".csv,.xlsx,.xls,.xlsm,.ods,text/csv" multiple></label>
    <label>Al cargar:
      <select id="f-mode" aria-label="Qué hacer con los datos al cargar un archivo">
        <option value="append">Añadir a los datos actuales</option>
        <option value="replace">Reemplazar los datos</option>
      </select>
    </label>
    <button id="b-metrics" type="button">📊 Métricas</button>
    <button id="b-export" type="button" title="Descarga un archivo con tus datos y ajustes">💾 Exportar sesión</button>
    <label class="btn" for="f-import" title="Abre un archivo de sesión exportado antes">📥 Importar sesión<input type="file" id="f-import" accept=".json,application/json"></label>
    <button id="b-clear" type="button">🗑️ Borrar datos</button>
    <button id="b-theme" type="button" aria-pressed="false">🌙 Modo oscuro</button>
  </div>
</header>

<div class="filters" role="group" aria-label="Filtros globales">
  <label>Deporte <select id="flt-sport"></select></label>
  <label>Desde <input type="date" id="flt-from"></label>
  <label>Hasta <input type="date" id="flt-to"></label>
  <label><input type="checkbox" id="flt-short"> Ocultar actividades de menos de 1 km</label>
  <button id="b-reset-flt" type="button">Quitar filtros</button>
  <span id="status" aria-live="polite"></span>
</div>

<nav role="tablist" aria-label="Páginas">
  <button role="tab" data-page="overview" type="button">Resumen</button>
  <button role="tab" data-page="running" type="button">Rendimiento en carrera</button>
  <button role="tab" data-page="heart" type="button">Corazón y esfuerzo</button>
  <button role="tab" data-page="form" type="button">Técnica de carrera</button>
  <button role="tab" data-page="compare" type="button">Comparar</button>
  <button role="tab" data-page="goals" type="button">Objetivos</button>
  <button role="tab" data-page="table" type="button">Tabla</button>
  <button role="tab" data-page="coach" type="button">🤖 Entrenador IA</button>
</nav>

<main id="main">
  <section id="p-overview" role="tabpanel" aria-label="Resumen"></section>
  <section id="p-running" role="tabpanel" aria-label="Rendimiento en carrera" hidden></section>
  <section id="p-heart" role="tabpanel" aria-label="Corazón y esfuerzo" hidden></section>
  <section id="p-form" role="tabpanel" aria-label="Técnica de carrera" hidden></section>
  <section id="p-compare" role="tabpanel" aria-label="Comparar" hidden></section>
  <section id="p-goals" role="tabpanel" aria-label="Objetivos" hidden></section>
  <section id="p-table" role="tabpanel" aria-label="Tabla" hidden></section>
  <section id="p-coach" role="tabpanel" aria-label="Entrenador IA" hidden></section>
</main>

<dialog id="dlg-metrics" aria-labelledby="dlg-title">
  <h3 id="dlg-title" style="margin-top:0">Métricas que quieres ver</h3>
  <p class="muted small">Se usan en «Métricas clave» del resumen, en todas las comparaciones y como columnas de la tabla.</p>
  <div class="chips">
    <button type="button" id="m-default">Restablecer predeterminadas</button>
    <button type="button" id="m-all">Todas</button>
    <button type="button" id="m-none">Ninguna</button>
  </div>
  <div class="mlist" id="m-list"></div>
  <div style="text-align:right"><button type="button" class="primary" id="m-close">Listo</button></div>
</dialog>

<div id="drop" aria-hidden="true">Suelta aquí tu archivo Excel o CSV</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   Panel de actividades — todo se procesa en el navegador.
   La sesión (datos + ajustes + objetivos) se guarda en localStorage.
   ===================================================================== */
const STORE = 'panelActividades.v1';
const PAL = ['#2563eb','#f97316','#16a34a','#dc2626','#9333ea','#0891b2','#ca8a04','#db2777','#4b5563','#65a30d'];
const DEFAULT_METRICS = ['Distancia','Ritmo medio','Frecuencia cardiaca media','TE aeróbico','Cadencia de carrera media'];
// t: tipo (num | dur = duración | pace = ritmo min/km | text); u: unidad; b: 1 = mejor más alto, -1 = mejor más bajo, 0 = neutro
// add: se puede sumar (totales); run: solo tiene sentido en deportes con distancia
const DEF = {
  'Distancia':{t:'num',u:'km',b:1,add:1},
  'Calorías':{t:'num',u:'kcal',b:1,add:1},
  'Tiempo':{t:'dur',b:1,add:1},
  'Frecuencia cardiaca media':{t:'num',u:'ppm',b:0,short:'FC media'},
  'FC máxima':{t:'num',u:'ppm',b:0},
  'TE aeróbico':{t:'num',u:'',b:1},
  'Cadencia de carrera media':{t:'num',u:'ppm',b:1,run:1,short:'Cadencia media'},
  'Cadencia de carrera máxima':{t:'num',u:'ppm',b:1,run:1,short:'Cadencia máx.'},
  'Ritmo medio':{t:'pace',b:-1,run:1},
  'Ritmo óptimo':{t:'pace',b:-1,run:1},
  'Ascenso total':{t:'num',u:'m',b:1,add:1},
  'Descenso total':{t:'num',u:'m',b:0,add:1},
  'Longitud media de zancada':{t:'num',u:'m',b:1,run:1,short:'Zancada media'},
  'Relación vertical media':{t:'num',u:'%',b:-1,run:1,short:'Relación vertical'},
  'Oscilación vertical media':{t:'num',u:'cm',b:-1,run:1,short:'Oscilación vertical'},
  'Tiempo medio de contacto con el suelo':{t:'num',u:'ms',b:-1,run:1,short:'Contacto con el suelo'},
  'GAP medio':{t:'pace',b:-1,run:1},
  'Normalized Power® (NP®)':{t:'num',u:'W',b:1,run:1,short:'NP'},
  'Training Stress Score®':{t:'num',u:'',b:0,add:1,short:'TSS'},
  'Potencia media':{t:'num',u:'W',b:1,run:1},
  'Potencia máxima':{t:'num',u:'W',b:1,run:1},
  'Pasos':{t:'num',u:'',b:1,add:1},
  'Descarga de Body Battery':{t:'num',u:'',b:0,add:1,short:'Body Battery'},
  'Descompresión':{t:'text'},
  'Mejor tiempo de vuelta':{t:'dur',b:-1},
  'Número de vueltas':{t:'num',u:'',b:0,add:1},
  'Ritmo respiratorio medio':{t:'num',u:'rpm',b:0,short:'Respiración media'},
  'Ritmo mínimo de respiración':{t:'num',u:'rpm',b:0,short:'Respiración mín.'},
  'Ritmo máximo de respiración':{t:'num',u:'rpm',b:0,short:'Respiración máx.'},
  'Tiempo en movimiento':{t:'dur',b:1,add:1},
  'Tiempo transcurrido':{t:'dur',b:0,add:1},
  'Altura mínima':{t:'num',u:'m',b:0},
  'Altura máxima':{t:'num',u:'m',b:0}
};
const ZONES = [
  {n:'Z1',lo:.5,hi:.6,l:'Recuperación',c:'#94a3b8'},
  {n:'Z2',lo:.6,hi:.7,l:'Base aeróbica',c:'#3b82f6'},
  {n:'Z3',lo:.7,hi:.8,l:'Tempo',c:'#22c55e'},
  {n:'Z4',lo:.8,hi:.9,l:'Umbral',c:'#f59e0b'},
  {n:'Z5',lo:.9,hi:9,l:'Máximo',c:'#ef4444'}
];
const BELOW = {n:'<Z1',l:'Por debajo de Z1',c:'#cbd5e1'};
const TE_BANDS = [[0,1,'Sin beneficio','#94a3b8'],[1,2,'Menor','#60a5fa'],[2,3,'Mantenimiento','#22c55e'],[3,4,'Mejora','#f59e0b'],[4,5,'Gran mejora','#f97316'],[5,99,'Sobrecarga','#ef4444']];
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ---------------- Estado y sesión ---------------- */
function defaultSettings(){
  return {theme: (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light',
    page:'overview', maxHR:null, hideShort:true, metrics:DEFAULT_METRICS.slice(), sport:'__all', from:'', to:'',
    excluded:[], compareIds:[], cmpMode:'sessions', cmpSports:[], pA:{from:'',to:''}, pB:{from:'',to:''}, pSport:'__all',
    goals:[], races:[], sortKey:'Fecha', sortDir:-1, search:'', allCols:false,
    coachTask:'semanal', coachN:15, coachWeeks:4, coachDays:4, coachAbout:'', coachQ:'', coachAct:'', coachTitles:false,
    serSel:'', serMode:'pace', thrPace:null, paceZones:null};
}
let S = {activities:[], meta:{}, headers:[], series:[], savedAt:null, settings:defaultSettings()};

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return false;
    applySession(JSON.parse(raw));
    return true;
  }catch(e){ console.warn(e); return false; }
}
function applySession(o){
  if(!o || !Array.isArray(o.activities)) throw new Error('El archivo no es una sesión válida de este panel.');
  S = {activities:o.activities, meta:o.meta||{}, headers:o.headers||[], series:Array.isArray(o.series)?o.series:[], savedAt:o.savedAt||null,
       settings:Object.assign(defaultSettings(), o.settings||{})};
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    S.savedAt = new Date().toISOString();
    try{ localStorage.setItem(STORE, JSON.stringify({version:1, ...S})); }
    catch(e){ toast('No se pudo guardar la sesión en el navegador (¿espacio lleno?). Usa «Exportar sesión».'); }
    renderStatus();
  }, 250);
}

/* ---------------- Utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isoLocal = d => ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
const D = iso => new Date(iso.length===10 ? iso+'T00:00:00' : iso);
const dmy = iso => { const [y,m,d] = iso.slice(0,10).split('-'); return d+'/'+m+'/'+y; };
const dm = iso => { const [,m,d] = iso.slice(0,10).split('-'); return d+'/'+m; };
const day = a => a.date.slice(0,10);

/* ---------------- Lectura de archivos ---------------- */
function detectDelim(t){
  const l = t.split(/\r?\n/)[0] || '';
  const c = ch => l.split(ch).length - 1;
  const tab=c('\t'), sc=c(';'), cc=c(',');
  return tab>cc && tab>sc ? '\t' : (sc>cc ? ';' : ',');
}
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const delim = detectDelim(text);
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; continue; }
    if(c==='"'){ q=true; continue; }
    if(c===delim){ row.push(f); f=''; continue; }
    if(c==='\r') continue;
    if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; continue; }
    f += c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()!==''));
}
async function readFile(file){
  const name = file.name.toLowerCase();
  if(/\.(xlsx|xlsm|xls|ods)$/.test(name)){
    if(!window.XLSX) throw new Error('No se pudo cargar la librería de Excel (¿sin conexión?). Prueba a guardar el archivo como CSV.');
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:'', dateNF:'yyyy-mm-dd hh:mm:ss'});
  }
  return parseCSV(await file.text());
}
function clean(v){
  if(v==null) return null;
  if(typeof v==='number' || v instanceof Date) return v;
  const s = String(v).trim().replace(/^'+/,'').trim();
  return (s==='' || s==='--' || s==='—' || s==='-') ? null : s;
}
function parseNum(v){
  v = clean(v); if(v==null) return null;
  if(typeof v==='number') return isFinite(v) ? v : null;
  if(v instanceof Date) return null;
  let s = v.replace(/\s/g,'');
  if(s.includes(',') && s.includes('.')){
    s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(s.includes(',')){
    s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,'') : s.replace(',','.');
  }
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const TIME_RE = /^(\d+):(\d{1,2}(?:\.\d+)?)(?::(\d{1,2}(?:\.\d+)?))?$/;
function parseDur(v){
  v = clean(v); if(v==null) return null;
  if(typeof v==='number') return v<1 ? v*86400 : v;
  if(v instanceof Date) return v.getHours()*3600 + v.getMinutes()*60 + v.getSeconds();
  const m = v.match(TIME_RE); if(!m) return null;
  return m[3]!==undefined ? (+m[1])*3600 + (+m[2])*60 + parseFloat(m[3]) : (+m[1])*60 + parseFloat(m[2]);
}
function parseDate(v){
  v = clean(v); if(v==null) return null;
  if(v instanceof Date) return isNaN(v) ? null : v;
  if(typeof v==='number'){ const d = new Date(Math.round((v-25569)*86400000)); return isNaN(d) ? null : new Date(d.getTime()+d.getTimezoneOffset()*60000); }
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/); // dd/mm/aaaa
  if(m){ const y = m[3].length===2 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0)); }
  const d = new Date(v); return isNaN(d) ? null : d;
}
function parseVal(v,t){
  if(t==='pace' || t==='dur') return parseDur(v);
  if(t==='num') return parseNum(v);
  const c = clean(v); return c==null ? null : String(c);
}
function inferMeta(h, col){
  const vs = col.map(clean).filter(x => x!=null);
  if(!vs.length) return {t:'num',u:'',b:0};
  if(vs.every(x => typeof x==='string' && TIME_RE.test(x))) return {t:/ritmo|pace|gap/i.test(h) ? 'pace' : 'dur', b:0};
  const nums = vs.filter(x => parseNum(x)!=null).length;
  return nums/vs.length >= .8 ? {t:'num',u:'',b:0} : {t:'text'};
}
function rowsToActivities(rows){
  if(!rows.length) throw new Error('El archivo está vacío.');
  const H = rows[0].map(h => String(h).trim());
  const find = (...names) => H.findIndex(h => names.includes(norm(h)));
  const iT = find('tipo de actividad','activity type','tipo'), iD = find('fecha','date'),
        iTi = find('titulo','title'), iF = find('favorito','favorite');
  if(iD < 0) throw new Error('No encuentro la columna «Fecha». ¿Es una exportación de actividades de Garmin?');
  const special = new Set([iT,iD,iTi,iF]);
  const meta = {};
  H.forEach((h,i) => { if(special.has(i) || !h) return; meta[h] = S.meta[h] || (DEF[h] ? {...DEF[h]} : inferMeta(h, rows.slice(1).map(r => r[i]))); });
  const idx = {}; H.forEach((h,i) => { if(!(h in idx)) idx[h]=i; });
  const acts = [];
  for(const r of rows.slice(1)){
    const d = parseDate(r[iD]); if(!d) continue;
    const sport = iT>=0 ? String(clean(r[iT]) || 'Otro') : 'Actividad';
    const a = {id:'', sport, date:isoLocal(d), title: iTi>=0 ? String(clean(r[iTi]) || '') : '',
               fav: iF>=0 && /^(true|s[ií]|yes|1)$/i.test(String(r[iF]||'').trim()), v:{}};
    for(const h in meta){
      let v = parseVal(r[idx[h]], meta[h].t);
      if(meta[h].run && !isDistSport(sport)) v = null; // p. ej. «cadencia» o «ritmo» en tenis no tienen sentido
      if(v!=null) a.v[h] = v;
    }
    a.id = a.date + '|' + sport;
    acts.push(a);
  }
  if(!acts.length) throw new Error('No se encontraron filas con una fecha válida.');
  return {acts, meta, headers:H.filter((h,i) => !special.has(i) && h)};
}
function ingest(res, mode){
  if(mode==='replace'){ S.activities=[]; S.meta={}; S.headers=[]; S.settings.excluded=[]; S.settings.compareIds=[]; }
  Object.assign(S.meta, res.meta);
  res.headers.forEach(h => { if(!S.headers.includes(h)) S.headers.push(h); });
  const pos = new Map(S.activities.map((a,i) => [a.id,i]));
  let added=0, updated=0;
  res.acts.forEach(a => { if(pos.has(a.id)){ S.activities[pos.get(a.id)] = a; updated++; } else { S.activities.push(a); added++; } });
  S.activities.sort((a,b) => a.date < b.date ? -1 : 1);
  S.settings.metrics = S.settings.metrics.filter(k => S.meta[k]);
  if(!S.settings.metrics.length) S.settings.metrics = DEFAULT_METRICS.filter(k => S.meta[k]);
  if(!S.settings.pA.from) setPeriodPreset('w4');
  return {added, updated};
}
async function handleFiles(files){
  let mode = $('#f-mode').value, A=0, U=0;
  const newSer = [];
  for(const f of files){
    try{
      const rows = await readFile(f);
      if(isLapsFile(rows)){ newSer.push(ingestSeries(rowsToLaps(rows, f.name))); continue; }
      const r = ingest(rowsToActivities(rows), mode);
      A += r.added; U += r.updated; mode = 'append';
    }catch(e){ toast('«'+f.name+'»: '+e.message); return; }
  }
  relinkSeries();
  if(newSer.length){ S.settings.serSel = newSer[newSer.length-1].id; if(!A && !U) S.settings.page = 'running'; }
  save(); render();
  const msg = [];
  if(A || U) msg.push(`${A} actividades nuevas` + (U ? `, ${U} actualizadas (ya existían)` : ''));
  newSer.forEach(s => { const a = actById(s.actId);
    msg.push(`series de «${s.file}» (${s.laps.length} vueltas) ` + (a ? `asociadas a ${dmy(a.date)} ${a.sport}` : 'sin actividad asociada: elígela en «Rendimiento en carrera»')); });
  toast('Datos cargados: ' + msg.join(' · ') + '.');
}

/* ---------------- Series / vueltas de una actividad ---------------- */
const LAP_FIRST = ['vueltas','vuelta','laps','lap','intervalo','intervalos','interval','intervals','split','splits','parciales','series'];
function isLapsFile(rows){
  const H = (rows[0]||[]).map(norm);
  if(H.includes('fecha') || H.includes('date')) return false;
  return LAP_FIRST.includes(H[0]) || H.includes('tipo de paso') || H.includes('step type') || H.includes('tiempo acumulado') || H.includes('cumulative time');
}
function rowsToLaps(rows, fileName){
  const H = rows[0].map(norm);
  // Primero busca el nombre exacto; si no, uno que empiece igual (Garmin añade la unidad: «Distancia km», «Ritmo medio min/km»…)
  const col = (...p) => { for(const x of p){ const i = H.indexOf(x); if(i>=0) return i; } for(const x of p){ const i = H.findIndex(h => h.startsWith(x+' ')); if(i>=0) return i; } return -1; };
  const c = {t:col('tiempo','time'), d:col('distancia','distance'), p:col('ritmo medio','avg pace'), gap:col('gap medio','avg gap'),
    hr:col('frecuencia cardiaca media','avg hr'), hrmax:col('fc maxima','max hr'), cad:col('cadencia de carrera media','avg run cadence'),
    pw:col('potencia media','avg power'), asc:col('ascenso total','total ascent'), mv:col('tiempo en movimiento','moving time'),
    step:col('tipo de paso','step type','tipo de intervalo','intervalo')};
  if(c.t<0) throw new Error('No encuentro la columna «Tiempo» de cada vuelta. ¿Es el CSV de vueltas exportado desde una actividad de Garmin Connect?');
  const get = (r,k,f) => c[k]>=0 ? f(r[c[k]]) : null;
  const laps = []; let sum = null;
  for(const r of rows.slice(1)){
    const label = String(clean(r[0]) ?? '').trim();
    const l = {n:label, step: c.step>=0 && c.step!==0 ? String(clean(r[c.step]) ?? '') : '', t:get(r,'t',parseDur), d:get(r,'d',parseNum), p:get(r,'p',parseDur), gap:get(r,'gap',parseDur),
      hr:get(r,'hr',parseNum), hrmax:get(r,'hrmax',parseNum), cad:get(r,'cad',parseNum), pw:get(r,'pw',parseNum), asc:get(r,'asc',parseNum), mv:get(r,'mv',parseDur)};
    if(l.p==null && l.t && l.d>0) l.p = l.t/l.d;
    if(/^(resumen|summary|total)/i.test(label)){ sum = l; continue; }
    if(l.t==null) continue;
    laps.push(l);
  }
  if(!laps.length) throw new Error('El archivo no tiene vueltas con tiempo.');
  if(!sum) sum = {t:laps.reduce((s,l) => s+(l.t||0),0), d:laps.reduce((s,l) => s+(l.d||0),0)};
  const gid = (fileName.match(/(\d{6,})/) || [])[1];
  return {id:'ser-'+(gid || norm(fileName)), garminId:gid||null, file:fileName, loadedAt:new Date().toISOString(), laps, sum:{t:sum.t, d:sum.d}, actId:null, ov:{}};
}
const actById = id => id ? S.activities.find(a => a.id===id) : null;
function matchActivity(s){
  const t = s.sum.t, d = s.sum.d; if(!t) return null;
  const taken = new Set(S.series.filter(x => x.id!==s.id && x.actId).map(x => x.actId));
  let best = null, bs = Infinity;
  S.activities.forEach(a => {
    if(taken.has(a.id) || !isDistSport(a.sport)) return;
    const at = a.v['Tiempo'], ad = a.v['Distancia']; if(!at) return;
    const sc = Math.abs(at-t)/t + (d && ad!=null ? Math.abs(ad-d)/Math.max(d,.1) : .02);
    if(sc<bs){ bs=sc; best=a; }
  });
  return bs < .04 ? best.id : null;
}
function ingestSeries(s){
  const old = S.series.find(x => x.id===s.id);
  if(old){ s.actId = old.actId; s.ov = old.ov || {}; S.series = S.series.filter(x => x.id!==s.id); }
  S.series.push(s);
  if(!actById(s.actId)) s.actId = matchActivity(s);
  return s;
}
function relinkSeries(){ (S.series||[]).forEach(s => { if(!actById(s.actId)) s.actId = matchActivity(s); }); }
function serLabel(s){ const a = actById(s.actId); return a ? dmy(a.date)+' · '+a.sport+(a.title?' · '+a.title:'')+(a.v['Distancia']!=null?' · '+nf(a.v['Distancia'])+' km':'') : 'Sin asociar · '+s.file; }
function serShort(s){ const a = actById(s.actId); return a ? dm(a.date)+' '+nf(a.v['Distancia']??s.sum.d,1)+' km' : s.file.replace(/\.[^.]+$/,'').slice(-14); }
function seriesList(){ return S.series.slice().sort((x,y) => { const a=actById(x.actId), b=actById(y.actId); return (a?a.date:'9'+x.loadedAt) < (b?b.date:'9'+y.loadedAt) ? -1 : 1; }); }

// Zonas por ritmo: proporción respecto a tu ritmo umbral (más alto = más lento). [nombre, desde (rápido), hasta (lento), color]
const PZ_DEF = [
  ['Por encima del umbral (VO2)', null, .98, '#ef4444'],
  ['Umbral', .98, 1.02, '#f97316'],
  ['Subumbral', 1.02, 1.07, '#eab308'],
  ['Tempo / ritmo maratón', 1.07, 1.15, '#22c55e'],
  ['Rodaje suave', 1.15, 1.30, '#3b82f6'],
  ['Recuperación', 1.30, null, '#94a3b8']];
const UNZ = {n:'Sin clasificar', c:'#9ca3af'};
function estThr(){ const v = S.activities.filter(a => isRun(a.sport) && (a.v['Distancia']||0)>=5 && a.v['Ritmo medio']).map(a => a.v['Ritmo medio']); return v.length ? Math.round(Math.min(...v)) : 300; }
const thrPace = () => S.settings.thrPace || estThr();
const makePZ = T => PZ_DEF.map(([n,f,s,c]) => ({n, c, fast: f==null ? null : Math.round(T*f), slow: s==null ? null : Math.round(T*s)}));
const paceZones = () => S.settings.paceZones || makePZ(thrPace());
const SER_MODES = {pace:'Ritmo medio de la vuelta', gap:'GAP (ritmo ajustado al desnivel)', hr:'Frecuencia cardiaca media'};
function zoneSet(){
  if(S.settings.serMode!=='hr') return paceZones();
  const mx = hrMax(); if(!mx) return [];
  return [{n:BELOW.n+' '+BELOW.l, c:BELOW.c, lo:0, hi:ZONES[0].lo*mx}, ...ZONES.map(z => ({n:z.n+' '+z.l, c:z.c, lo:z.lo*mx, hi:z.hi>1 ? 999 : z.hi*mx}))];
}
function autoZone(l,Z){
  const m = S.settings.serMode;
  if(m==='hr'){ const v = l.hr; if(v==null) return UNZ; return Z.find(z => v>=z.lo && v<z.hi) || UNZ; }
  const v = m==='gap' ? (l.gap ?? l.p) : l.p; if(v==null) return UNZ;
  return Z.find(z => (z.fast==null || v>=z.fast) && (z.slow==null || v<z.slow)) || UNZ;
}
// null = el usuario ha marcado esa vuelta como «no contar»
function lapZone(s,i,Z){ const ov = (s.ov||{})[i]; if(ov==='__skip') return null; if(ov){ const z = Z.find(x => x.n===ov); if(z) return z; } return autoZone(s.laps[i],Z); }
function serStats(s,Z){
  Z = Z || zoneSet();
  const rows = [...Z, UNZ].map(z => ({z, t:0, d:0, n:0, hrw:0, hrt:0}));
  s.laps.forEach((l,i) => { const z = lapZone(s,i,Z); if(z===null) return; const r = rows.find(x => x.z.n===z.n) || rows[rows.length-1];
    r.t += l.t||0; r.d += l.d||0; r.n++; if(l.hr!=null && l.t){ r.hrw += l.hr*l.t; r.hrt += l.t; } });
  return rows;
}
function pzRange(z){
  if(z.fast!=null && z.slow!=null) return paceStr(z.fast)+' – '+paceStr(z.slow)+' /km';
  if(z.slow!=null) return 'más rápido que '+paceStr(z.slow)+' /km';
  if(z.fast!=null) return 'más lento que '+paceStr(z.fast)+' /km';
  return 'cualquier ritmo';
}
function seriesCoachLines(s){
  const Z = zoneSet(), out = ['', 'Series / vueltas de esta actividad (zona según '+SER_MODES[S.settings.serMode].toLowerCase()+'):'];
  s.laps.forEach((l,i) => { const z = lapZone(s,i,Z);
    out.push(`- Vuelta ${l.n}${l.step?' ('+l.step+')':''}: ${hms(l.t)}, ${nf(l.d)} km, ${paceStr(l.p)} /km${l.hr!=null?', FC '+l.hr+' ppm':''}${l.cad!=null?', cadencia '+l.cad+' ppm':''}, zona: ${z?z.n:'no contada'}`); });
  out.push('Minutos por zona: '+serStats(s,Z).filter(r => r.t>0).map(r => r.z.n+' '+nf(r.t/60,1)).join(', ')+'.');
  if(S.settings.serMode!=='hr') out.push('Mis zonas de ritmo: '+Z.map(z => z.n+' '+pzRange(z)).join('; ')+'.');
  return out;
}

  const zoneTable = `<div class="tablewrap" style="max-height:none"><table><thead><tr><th scope="col">Zona</th><th scope="col" class="num">Vueltas</th><th scope="col" class="num">Tiempo</th><th scope="col" class="num">% del tiempo</th><th scope="col" class="num">Distancia</th><th scope="col" class="num">Ritmo medio</th><th scope="col" class="num">FC media</th></tr></thead><tbody>${
    stats.filter(r => r.n>0 || r.z!==UNZ).map(r => `<tr><th scope="row"><span class="dot" style="background:${r.z.c}"></span>${esc(r.z.n)}${r.z.fast!==undefined?` <span class="small muted">(${pzRange(r.z)})</span>`:''}</th><td class="num">${r.n||'—'}</td><td class="num">${r.t?hms(r.t):'—'}</td><td class="num">${counted&&r.t?nf(r.t/counted*100,0)+' %':'—'}</td><td class="num">${r.d?nf(r.d)+' km':'—'}</td><td class="num">${r.d>0?paceStr(r.t/r.d)+' /km':'—'}</td><td class="num">${r.hrt?nf(r.hrw/r.hrt,0)+' ppm':'—'}</td></tr>`).join('')}</tbody></table></div>`;
  let zoneCfg;
  if(mode==='hr'){
    zoneCfg = hrMax() ? `<p class="small">Zonas por FC con tu FC máxima de <strong>${hrMax()} ppm</strong>. Cámbiala en la página «Corazón y esfuerzo».</p><ul class="small">${Z.map(z => `<li><span class="dot" style="background:${z.c}"></span>${esc(z.n)}: ${Math.round(z.lo)}${z.hi>900?'+':'–'+(Math.round(z.hi)-1)} ppm</li>`).join('')}</ul>`
      : '<p class="small">No hay FC máxima. Indícala en «Corazón y esfuerzo».</p>';
  } else {

      <button type="button" data-act="ser-del">Quitar estas series</button></div>
      <p class="small muted" style="margin-bottom:0">Archivo: ${esc(s.file)} · ${s.laps.length} vueltas · ${hms(s.sum.t)} · ${nf(s.sum.d)} km${actById(s.actId)?'':' · <strong>elige la actividad a la que pertenece</strong>'}</p></div>
    <div class="kpis" style="margin-top:14px">${kpi('Vueltas contadas', nCounted, 'de '+s.laps.length)}${kpi('Tiempo contado', hms(counted))}${zones.map(r => kpi(r.z.n, hms(r.t), (counted?nf(r.t/counted*100,0)+' % · ':'')+r.n+(r.n===1?' vuelta':' vueltas')+(r.d>0?' · '+paceStr(r.t/r.d)+' /km':''))).join('')}</div>
    <div class="grid2">

    <div class="card" style="margin-top:14px"><h3>Detalle de cada vuelta / serie</h3><div class="tablewrap" style="max-height:none"><table><thead><tr><th scope="col">Vuelta</th>${s.laps.some(x => x.step)?'<th scope="col">Tipo</th>':''}<th scope="col">Zona</th><th scope="col" class="num">Tiempo</th><th scope="col" class="num">Distancia</th><th scope="col" class="num">Ritmo</th><th scope="col" class="num">GAP</th><th scope="col" class="num">FC media</th><th scope="col" class="num">FC máx.</th><th scope="col" class="num">Cadencia</th><th scope="col" class="num">Potencia (W)</th><th scope="col" class="num">Ascenso (m)</th></tr></thead><tbody>${lapRows}</tbody></table></div></div>
    <div class="grid2">
      <div class="card"><h3>Tus zonas (${esc(SER_MODES[mode])})</h3>${zoneCfg}</div>

    </div>`;
  const cols = s.laps.map((l,i) => { const z = lapZone(s,i,Z); return z ? z.c : 'transparent'; });

      {label:'FC media', data:s.laps.map(l => l.hr ?? null), borderColor:PAL[3], backgroundColor:PAL[3], borderDash:[5,4], pointRadius:2, tension:.2, yAxisID:'y1', spanGaps:true}]},
    options:opts({interaction:{mode:'index',intersect:false},
      scales:{x:{title:{display:true,text:'Vuelta'}}, y:{reverse:true, title:{display:true,text:(mode==='gap'?'GAP':'Ritmo')+' (más arriba = más rápido)'}, ticks:{callback:v => paceStr(v)}},
        y1:{position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'FC (ppm)'}}},
      plugins:{tooltip:{callbacks:{label:c => c.datasetIndex===0 ? `${mode==='gap'?'GAP':'Ritmo'}: ${paceStr(c.parsed.y)} /km · ${names[c.dataIndex]}` : `FC media: ${c.parsed.y} ppm`}}}})});
  const tc = themeColors();

    options:opts({plugins:{legend:{position:'right',labels:{color:tc.text}}, tooltip:{callbacks:{label:c => `${c.label}: ${nf(c.raw,1)} min`}}}})});
  if(inScope.length>1){
    const all = inScope.map(x => serStats(x,Z)), zi = [...Z, UNZ].map((z,i) => i).filter(i => all.some(r => r[i].t>0));
    barChart('c-ser-cmp', inScope.map(serShort), zi.map(i => { const z = i<Z.length ? Z[i] : UNZ; return {label:z.n, color:z.c, data:all.map(r => +(r[i].t/60).toFixed(1))}; }), {stacked:true, u:'min'});

function serCmpTable(list,Z){
  const all = list.map(x => serStats(x,Z)), zi = [...Z, UNZ].map((z,i) => i).filter(i => all.some(r => r[i].t>0));

    list.map((x,j) => { const tot = all[j].reduce((t,r) => t+r.t, 0);

    <p class="small muted">Minutos por zona en cada sesión de series (respeta los filtros de fecha y deporte).</p>`;

/* ---------------- Formato ---------------- */
const nf = (v,d=2) => (v==null || !isFinite(v)) ? '—' : v.toLocaleString('es-ES',{maximumFractionDigits:d});
function hms(s){ if(s==null || !isFinite(s)) return '—'; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h ? h+':'+pad(m) : m)+':'+pad(x); }
function paceStr(s){ if(s==null || !isFinite(s)) return '—'; s=Math.round(s); return Math.floor(s/60)+':'+pad(s%60); }
function fmtT(t,v,u){ if(v==null || !isFinite(v)) return '—'; if(t==='pace') return paceStr(v)+' /km'; if(t==='dur') return hms(v); return nf(v)+(u ? ' '+u : ''); }
function fmt(k,v){ if(k==='__n') return nf(v,0); const m=S.meta[k]; if(!m) return '—'; if(m.t==='text') return v==null ? '—' : esc(v); return fmtT(m.t,v,m.u); }
function fmtDelta(k,d){
  if(d==null || !isFinite(d)) return '—';
  const sign = d>0 ? '+' : (d<0 ? '−' : ''), m = S.meta[k], a = Math.abs(d);
  if(k==='__n') return sign+nf(a,0);
  if(m.t==='pace') return sign+paceStr(a)+' /km';
  if(m.t==='dur') return sign+hms(a);
  return sign+nf(a)+(m.u ? ' '+m.u : '');
}
const short = k => (S.meta[k] && S.meta[k].short) || k;
const numericKeys = () => S.headers.filter(k => S.meta[k] && S.meta[k].t!=='text');
const selMetrics = () => S.settings.metrics.filter(k => S.meta[k] && S.meta[k].t!=='text');

/* ---------------- Filtros y agregados ---------------- */
const isShort = a => { const d=a.v['Distancia']; return S.settings.hideShort && isDistSport(a.sport) && d!=null && d<1; };
const inSD = a => (S.settings.sport==='__all' || a.sport===S.settings.sport) && (!S.settings.from || day(a)>=S.settings.from) && (!S.settings.to || day(a)<=S.settings.to);
const isExcl = a => S.settings.excluded.includes(a.id);
const base = () => S.activities.filter(a => !isExcl(a) && !isShort(a));
const filtered = () => base().filter(inSD);
const runs = () => filtered().filter(a => isRun(a.sport));
const sportsOf = L => [...new Set(L.map(a => a.sport))].sort();
const allSports = () => sportsOf(S.activities);
const sportColor = s => PAL[Math.max(0,allSports().indexOf(s)) % PAL.length];
const vals = (L,k) => L.map(a => a.v[k]).filter(x => typeof x==='number' && isFinite(x));
function agg(L,k,how){
  if(how==='count') return L.length;
  const v = vals(L,k); if(!v.length) return null;
  if(how==='sum') return v.reduce((s,x) => s+x, 0);
  if(how==='max') return Math.max(...v);
  if(how==='min') return Math.min(...v);
  const m = S.meta[k];
  if(m && m.t==='pace'){ // ritmo medio ponderado por distancia (= tiempo total / distancia total)
    let s=0, w=0; L.forEach(a => { const x=a.v[k], d=a.v['Distancia']; if(x!=null && d>0){ s+=x*d; w+=d; } });
    if(w) return s/w;
  }
  return v.reduce((s,x) => s+x, 0)/v.length;
}
function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function pkey(iso,p){ return p==='month' ? iso.slice(0,7) : ymd(weekStart(D(iso.slice(0,10)))); }
function pkeys(fromIso,toIso,p){
  const out=[]; const f=D(fromIso.slice(0,10)), end=D(toIso.slice(0,10));
  let d = p==='month' ? new Date(f.getFullYear(), f.getMonth(), 1) : weekStart(f);
  while(d<=end && out.length<520){ out.push(p==='month' ? ymd(d).slice(0,7) : ymd(d)); d = p==='month' ? new Date(d.getFullYear(), d.getMonth()+1, 1) : new Date(d.getFullYear(), d.getMonth(), d.getDate()+7); }
  return out;
}
function plabel(k,p){ if(p==='month'){ const [y,m]=k.split('-'); return MES[+m-1]+' '+y.slice(2); } return 'Sem. '+dm(k); }
function groupBy(L,p){ const g={}; L.forEach(a => { const k=pkey(a.date,p); (g[k]=g[k]||[]).push(a); }); return g; }
const actLabel = a => dm(a.date)+' '+a.sport;

/* ---------------- Gráficos ---------------- */
const charts = {};
function mk(id,cfg){ if(charts[id]) charts[id].destroy(); const el=document.getElementById(id); if(!el || !window.Chart) return; charts[id] = new Chart(el,cfg); }
function gc(){ for(const id in charts){ if(!document.body.contains(charts[id].canvas)){ charts[id].destroy(); delete charts[id]; } } }
const opts = (x={}) => Object.assign({responsive:true, maintainAspectRatio:false, animation:{duration:reduceMotion()?0:350}}, x);
function themeColors(){ const cs=getComputedStyle(document.documentElement); return {text:cs.getPropertyValue('--text').trim(), grid:cs.getPropertyValue('--grid').trim(), muted:cs.getPropertyValue('--muted').trim()}; }
function chartBox(id,label,cls=''){ return `<div class="chart ${cls}"><canvas id="${id}" role="img" aria-label="${esc(label)}"></canvas></div>`; }
const card = (title,inner) => `<div class="card"><h3>${esc(title)}</h3>${inner}</div>`;
const kpi = (l,v,s='') => `<div class="kpi"><div class="l">${esc(l)}</div><div class="v">${v}</div>${s?`<div class="s">${esc(s)}</div>`:''}</div>`;
function lineChart(id,labels,sets,o={}){
  const t=o.t||'num', u=o.u||'';
  mk(id,{type:'line', data:{labels, datasets:sets.map((s,i) => { const c=s.color||PAL[i%PAL.length]; return {label:s.label, data:s.data, borderColor:c, backgroundColor:c+'33', tension:.25, spanGaps:true, pointRadius:3, borderDash:s.dash||[], fill:!!s.fill}; })},
    options:opts({interaction:{mode:'index',intersect:false},
      scales:{y:{reverse:!!o.reverse, beginAtZero:!!o.zero, ticks:{callback:v => fmtT(t,v,u)}}},
      plugins:{legend:{display:sets.length>1}, tooltip:{callbacks:{label:c => `${c.dataset.label}: ${fmtT(t,c.parsed.y,u)}`}}}})});
}
function barChart(id,labels,sets,o={}){
  const t=o.t||'num', u=o.u||'';
  mk(id,{type:'bar', data:{labels, datasets:sets.map((s,i) => ({label:s.label, data:s.data, type:s.type||'bar', backgroundColor:s.colors||s.color||PAL[i%PAL.length], borderColor:s.color||PAL[i%PAL.length], borderDash:s.dash||[], pointRadius:s.type==='line'?0:undefined, fill:false, borderRadius:s.type==='line'?0:4}))},
    options:opts({scales:{x:{stacked:!!o.stacked}, y:{stacked:!!o.stacked, beginAtZero:true, ticks:{callback:v => fmtT(t,v,u)}}},
      plugins:{legend:{display:sets.length>1}, tooltip:{callbacks:{label:c => `${c.dataset.label}: ${fmtT(t,c.parsed.y,u)}`, ...(o.title?{title:o.title}:{})}}}})});
}
function rangeOf(k){ const v=vals(base(),k); return v.length ? [Math.min(...v), Math.max(...v)] : [0,1]; }
function score(k,v){ if(v==null) return null; const [lo,hi]=rangeOf(k); let s = hi>lo ? (v-lo)/(hi-lo)*100 : 50; if(S.meta[k].b===-1) s=100-s; return Math.round(Math.max(0,Math.min(100,s))); }
function radar(id,names,ks,get){
  const tc = themeColors();
  mk(id,{type:'radar', data:{labels:ks.map(short), datasets:names.map((n,i) => ({label:n, data:ks.map(k => score(k,get(i,k))), borderColor:PAL[i%PAL.length], backgroundColor:PAL[i%PAL.length]+'22', pointRadius:3, spanGaps:true}))},
    options:opts({scales:{r:{min:0,max:100,ticks:{display:false},grid:{color:tc.grid},angleLines:{color:tc.grid},pointLabels:{color:tc.text}}},
      plugins:{tooltip:{callbacks:{label:c => { const k=ks[c.dataIndex]; return `${c.dataset.label}: ${fmt(k,get(c.datasetIndex,k))} (puntuación ${c.raw ?? '—'}/100)`; }}}}})});
}
function smallMultiples(cid,names,ks,get){
  const box = document.getElementById(cid); if(!box) return;
  box.innerHTML = ks.map((k,j) => `<div class="card"><h4>${esc(k)}</h4>${chartBox(cid+'-'+j, k, 'sm-h')}</div>`).join('');
  ks.forEach((k,j) => { const m=S.meta[k];
    mk(cid+'-'+j,{type:'bar', data:{labels:names, datasets:[{label:k, data:names.map((_,i) => get(i,k)), backgroundColor:names.map((_,i) => PAL[i%PAL.length]), borderRadius:4}]},
      options:opts({plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => fmt(k,c.parsed.y)}}}, scales:{y:{beginAtZero:true, ticks:{callback:v => fmtT(m.t,v,m.u)}}}})}); });
}
function cmpTable(cols,rows,{delta=false}={}){
  let h = '<div class="tablewrap" style="max-height:none"><table><thead><tr><th scope="col">Métrica</th>' + cols.map(c => `<th scope="col" class="num">${c}</th>`).join('') + (delta?'<th scope="col" class="num">Diferencia (A − B)</th><th scope="col" class="num">Dif. %</th>':'') + '</tr></thead><tbody>';
  rows.forEach(r => {
    const m = S.meta[r.k], b = m ? m.b : 0;
    const nn = r.values.filter(v => v!=null);
    const best = (b && nn.length>1 && !delta) ? (b===1 ? Math.max(...nn) : Math.min(...nn)) : null;
    h += `<tr><th scope="row">${esc(r.label)}</th>` + r.values.map(v => `<td class="num${best!=null && v===best ? ' best' : ''}">${fmt(r.k,v)}</td>`).join('');
    if(delta){
      const [A,B] = r.values, d = (A!=null && B!=null) ? A-B : null;
      const cls = (d && b) ? ((d*b)>0 ? 'good' : 'bad') : '';
      h += `<td class="num ${cls}">${fmtDelta(r.k,d)}</td><td class="num ${cls}">${(d!=null && B) ? (d>0?'+':'')+nf(d/B*100,1)+' %' : '—'}</td>`;
    }
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}
function groupRows(groups,ks){
  const rows = [{k:'__n', label:'Nº de actividades', values:groups.map(g => g.length)}];
  ks.forEach(k => { const m=S.meta[k];
    if(m.add) rows.push({k, label:k+' — total', values:groups.map(g => agg(g,k,'sum'))});
    rows.push({k, label:k+(m.add ? ' — media por actividad' : ' — media'), values:groups.map(g => agg(g,k,'avg'))}); });
  return rows;
}

/* ---------------- Páginas ---------------- */
function welcome(){
  return `<div class="card welcome"><h2>Carga tu archivo de actividades</h2>
  <p>Exporta tus actividades desde Garmin Connect (Actividades → Exportar CSV) o usa un Excel con las mismas columnas, y cárgalo con el botón <strong>«Cargar Excel / CSV»</strong> o arrastrándolo a esta ventana.</p>
  <p class="muted">Tus datos se procesan solo en este navegador y se guardan aquí mismo para la próxima vez. No se envían a ningún sitio.</p>
  <label class="btn primary" for="f-file">📂 Elegir archivo</label></div>`;
}
const noFiltered = () => `<div class="card welcome"><p>No hay actividades con los filtros actuales.</p><button type="button" data-act="reset-filters">Quitar filtros</button></div>`;

function renderOverview(el){
  const L = filtered(); if(!L.length){ el.innerHTML = noFiltered(); return; }
  const sum = k => agg(L,k,'sum');
  el.innerHTML = `<div class="kpis">${kpi('Actividades',L.length)}${kpi('Distancia',fmt('Distancia',sum('Distancia')))}${kpi('Tiempo',fmtT('dur',sum('Tiempo')))}${kpi('Calorías',fmt('Calorías',sum('Calorías')))}${kpi('Pasos',fmt('Pasos',sum('Pasos')))}${kpi('Ascenso total',fmt('Ascenso total',sum('Ascenso total')))}</div>
  <h2 class="sec">Métricas clave <small>— cámbialas con el botón «📊 Métricas»</small></h2>
  <div class="kpis">${selMetrics().map(k => { const m=S.meta[k]; return kpi(k, fmt(k,agg(L,k,m.add?'sum':'avg')), (m.add?'Total':'Media')+' de '+vals(L,k).length+' actividades'); }).join('') || '<p class="muted">No hay métricas elegidas.</p>'}</div>
  <div class="grid2">
    ${card('Tiempo por semana y deporte (minutos)', chartBox('c-ov-week','Tiempo semanal por deporte'))}
    ${card('Reparto por deporte (nº de actividades)', chartBox('c-ov-sport','Reparto por deporte'))}
    ${card('Distancia semanal (km)', chartBox('c-ov-dist','Distancia semanal'))}
    ${card('Calendario de actividad', heatmapHTML(L))}
  </div>`;
  const keys = pkeys(L[0].date, L[L.length-1].date, 'week'), g = groupBy(L,'week'), sp = sportsOf(L);
  barChart('c-ov-week', keys.map(k => plabel(k,'week')), sp.map(s => ({label:s, color:sportColor(s), data:keys.map(k => Math.round((g[k]||[]).filter(a => a.sport===s).reduce((t,a) => t+(a.v['Tiempo']||0),0)/60))})), {stacked:true, u:'min'});
  const tc = themeColors();
  mk('c-ov-sport',{type:'doughnut', data:{labels:sp, datasets:[{data:sp.map(s => L.filter(a => a.sport===s).length), backgroundColor:sp.map(sportColor), borderColor:getComputedStyle(document.documentElement).getPropertyValue('--panel').trim()}]}, options:opts({plugins:{legend:{position:'right', labels:{color:tc.text}}}})});
  barChart('c-ov-dist', keys.map(k => plabel(k,'week')), [{label:'Distancia', data:keys.map(k => +(agg(g[k]||[],'Distancia','sum')||0).toFixed(2))}], {u:'km'});
}
function heatmapHTML(L){
  const by = {};
  L.forEach(a => { const d=day(a); (by[d]=by[d]||{m:0,s:[]}).m += (a.v['Tiempo']||0)/60; by[d].s.push(a.sport); });
  const first = weekStart(D(day(L[0]))), lastW = weekStart(D(day(L[L.length-1])));
  const end = new Date(lastW.getFullYear(), lastW.getMonth(), lastW.getDate()+6);
  const mx = Math.max(1, ...Object.values(by).map(x => x.m));
  const lo = day(L[0]), hi = day(L[L.length-1]);
  let cells = '';
  for(let d=new Date(first); d<=end; d=new Date(d.getFullYear(), d.getMonth(), d.getDate()+1)){
    const k = ymd(d), x = by[k];
    if(k<lo || k>hi){ cells += '<div class="hm out"></div>'; continue; }
    const lv = !x ? 0 : Math.min(4, 1+Math.floor(x.m/mx*3.999));
    const t = dmy(k)+' — '+(x ? Math.round(x.m)+' min · '+x.s.join(', ') : 'sin actividad');
    cells += `<div class="hm l${lv}" title="${esc(t)}"></div>`;
  }
  const days = Object.keys(by).length;
  return `<div class="hm-wrap" role="img" aria-label="${esc('Calendario: '+days+' días con actividad entre '+dmy(lo)+' y '+dmy(hi))}"><div class="hm-days"><span>L</span><span></span><span>X</span><span></span><span>V</span><span></span><span>D</span></div><div class="hm-grid">${cells}</div></div>
  <div class="legend">Menos <span class="hm"></span><span class="hm l1"></span><span class="hm l2"></span><span class="hm l3"></span><span class="hm l4"></span> Más · color = minutos de actividad del día. Pasa el ratón por un día para ver el detalle.</div>
  <p class="small muted">${days} días con actividad de ${daysBetween(lo,hi)} días del periodo.</p>`;
}

function setPeriodPreset(p){

  else if(p==='w4'){ st.pA = {from:addDays(last,-27), to:last}; st.pB = {from:addDays(last,-55), to:addDays(last,-28)}; }
  else if(p==='m'){ const d=D(last), a1=new Date(d.getFullYear(),d.getMonth(),1), a2=new Date(d.getFullYear(),d.getMonth()+1,0), b1=new Date(d.getFullYear(),d.getMonth()-1,1), b2=new Date(d.getFullYear(),d.getMonth(),0);

/* ---- Objetivos ---- */
const AGG_L = {sum:'suma',avg:'media',max:'máximo',min:'mínimo',count:'número de actividades'};
const PER_L = {week:'por semana',month:'por mes',total:'en todo el rango'};
function parseTarget(metric,s){ const t = metric==='__count' ? 'num' : (S.meta[metric]||{}).t; return (t==='pace'||t==='dur') ? parseDur(s) : parseNum(s); }
function fmtGoal(g,v){ return g.metric==='__count' ? nf(v,0)+' act.' : fmt(g.metric,v); }
const goalMet = (g,v) => v!=null && (g.dir==='>=' ? v>=g.target : v<=g.target);
const goalPct = (g,v) => v==null ? 0 : (g.dir==='>=' ? (g.target ? v/g.target*100 : 100) : (v<=g.target ? 100 : g.target/v*100));
function goalData(g){
  const how = g.metric==='__count' ? 'count' : g.agg;
  const L = base().filter(a => (g.sport==='__all' || a.sport===g.sport) && (!g.start || day(a)>=g.start) && (!g.end || day(a)<=g.end));
  const zeroIfEmpty = how==='sum' || how==='count';
  if(g.period==='total'){
    const series = L.map((a,i) => agg(L.slice(0,i+1), g.metric, how));
    return {how, L, value:agg(L,g.metric,how) ?? (zeroIfEmpty ? 0 : null), labels:L.map(actLabel), series};
  }
  const today = ymd(new Date());
  const from = g.start || (L[0] ? day(L[0]) : today);
  let to = g.end || today; if(g.end && g.end>today) to = today;
  let keys = pkeys(from, to, g.period); if(keys.length>104) keys = keys.slice(-104);
  const gr = groupBy(L, g.period);
  const values = keys.map(k => { const x=agg(gr[k]||[], g.metric, how); return x==null ? (zeroIfEmpty ? 0 : null) : x; });
  const cur = pkey(today, g.period), ci = keys.indexOf(cur);
  let li = -1; keys.forEach((k,i) => { if(gr[k]) li = i; });
  const done = values.filter(v => goalMet(g,v)).length;

/* ---- Carreras y objetivos a largo plazo ----

   - volumen semanal sube como mucho un 10 % y cada 4.ª semana es de descarga (−20 %);
   - fase de base (hasta el 75 % del volumen pico) y bloque específico de hasta 16 semanas;

  if(dist<=43) return {peak:trail?65:60, long:32};
  if(dist<=60) return {peak:70, long:35};
  if(dist<=85) return {peak:80, long:40};
  if(dist<=120) return {peak:90, long:45};

const r1 = x => Math.round(x*10)/10;

const predictT = (fit,dist) => fit && fit.best ? fit.best.t*Math.pow(dist/fit.best.d,RIEGEL) : null;

const terrainF = r => isTrail(r) ? 1.10 + .20*Math.max(0, Math.min(r.dist,160)-42)/118 : 1;

  if(w.phase==='Afinamiento') return T ? `Rodajes cortos con alguna subida suave a ritmo cómodo. Revisa material, frontal y nutrición.` : `Rodajes cortos + 3 × 1 km a ritmo de carrera${P?' ('+pe(P.race)+')':''}. Descansa bien.`;
  if(w.rec) return `Semana de descarga: solo rodajes suaves${easy}.`;
  if(T){
    if(w.phase==='Base') return `Rodajes suaves${easy} por terreno con desnivel + caminar rápido en subidas.`;
    if(w.phase==='Desarrollo') return `Cuestas: ${6+Math.round(prog*4)} × 2–3 min en subida fuerte, bajar trotando. Fuerza de piernas 2×/semana.`;
    return ultra ? `Tirada larga por montaña de ${nf(w.long,0)} km${w.dplus?' con ~'+nf(w.dplus*.45,0)+' m D+':''} + al día siguiente ${nf(Math.max(8,w.long*.5),0)} km suaves (back-to-back). Practica la nutrición.`
      : `Tirada larga por montaña de ${nf(w.long,0)} km con subidas a ritmo de carrera y bajadas técnicas.`;
  }

  if(w.phase==='Desarrollo') return `Umbral: ${2+Math.round(prog*2)} × 10 min${P?' a '+pe(P.thr):''}, recuperación 2 min.`;

function buildPlan(r, P){

    const phase = inBase ? 'Base' : (si<half ? 'Desarrollo' : 'Específico');

    const last = j===taper-1;
    out.push({wk:weeks[build+j], phase: last ? 'Carrera' : 'Afinamiento', rec:false, prog:0,

function raceTrack(plan, fit){

    w.cur = w.wk===cw; w.future = w.wk>cw;
    if(w.future) return;
    if(!ref || w.wk>ref){ w.st = 'nodata'; return; }
    const L = g[w.wk] || [];
    w.act = r1(L.reduce((s,a) => s+a.v['Distancia'],0)); w.actLong = L.length ? r1(Math.max(...L.map(a => a.v['Distancia']))) : 0;
    w.actD = Math.round(L.reduce((s,a) => s+(a.v['Ascenso total']||0),0));
    const q = w.km ? w.act/w.km : 1;

function raceChecks(r, fit, M){

  if(!fit) out.push(['warn','Todavía no hay carreras en tus datos: el plan parte de 10 km por semana.']);
  else if(daysBetween(fit.ref,today) > 8) out.push(['warn',`Tus datos de carrera terminan el ${dmy(fit.ref)}. Carga una exportación más reciente para que el seguimiento semanal sea real.`]);
  const pred = racePred(r, fit);
  if(r.target && pred){
    const gap = (pred-r.target)/r.target, allow = Math.min(.12, weeksLeft*.005);
    if(gap<=0) out.push(['ok',`Tu predicción actual (${hms(pred)}) ya iguala o mejora tu objetivo (${hms(r.target)}). Podrías apuntar más alto.`]);
    else if(gap<=allow) out.push(['ok',`Te faltan ${hms(pred-r.target)} (${nf(gap*100,1)} %). Con ${Math.round(weeksLeft)} semanas es una mejora realista.`]);
    else if(gap<=allow*1.5+.01) out.push(['warn',`Exigente: necesitas mejorar un ${nf(gap*100,1)} % y lo habitual en ${Math.round(weeksLeft)} semanas es hasta ~${nf(allow*100,0)} %. Es posible si cumples el plan con constancia.`]);
    else out.push(['ko',`Muy ambicioso: necesitas mejorar un ${nf(gap*100,1)} % y lo habitual en ${Math.round(weeksLeft)} semanas es ~${nf(allow*100,0)} %. Un objetivo realista hoy sería ~${hms(pred*(1-allow))}.`]);
  } else if(pred) out.push(['info',`Sin tiempo objetivo: con tu forma actual la predicción es ${hms(pred)} (${pe(pred/r.dist)}).`]);
  else if(r.target) out.push(['info','No hay carreras de 3 km o más en las últimas 6 semanas de tus datos, así que no puedo estimar si el tiempo objetivo es realista.']);

  if(maxPlan < M.peak*.9) out.push(['warn',`Con el tiempo disponible el plan llega a ${nf(maxPlan,0)} km por semana; para ${nf(r.dist,1)} km se recomiendan ~${nf(M.peak,0)}. No subas más de un 10 % por semana para compensar.`]);
  else out.push(['ok',`Volumen: de ${nf(M.start,0)} km por semana al empezar el plan a un pico de ${nf(maxPlan,0)} km, subiendo como mucho un 10 % por semana.`]);
  if(fit) out.push(fit.longest >= M.longPeak

const ST_L = {ok:['ok','✓ Cumplida'], warn:['warn','≈ Casi'], ko:['ko','✗ Por debajo'], cur:['info','En curso'], part:['info','Datos parciales'], nodata:['info','Sin datos aún']};

function weekSplit(w, days){

  return `Reparte en ${days} días: tirada larga de ${nf(w.long,1)} km${w.rec?'':' + 1 sesión clave (~8 km con calentamiento)'} + ${easyN} rodaje${easyN>1?'s':''} suave${easyN>1?'s':''} de ~${nf(easyKm,0)} km.`;
}

  if(st.goals.length) st.goals.forEach(g => out.push(coachGoalLine(g))); else if(!races.length) out.push('- No he definido objetivos en el panel.');
  const n = Math.max(1, Math.min(200, +st.coachN || 15));
  out.push('', `## Actividades recientes (últimas ${Math.min(n,L.length)} de ${L.length}, de más antigua a más reciente)`);
  L.slice(-n).forEach(a => out.push(coachLine(a, keys)));
  const allKeys = numericKeys();
  out.push('', '## Lo que te pido');
  const t = st.coachTask;
  if(t==='semanal'){
    const from = addDays(last,-6);
    out.push(`Analiza mi última semana de entrenamiento (${dmy(from)} – ${dmy(last)}) y compárala con las semanas anteriores: volumen, intensidad, distribución por zonas, recuperación y posibles señales de fatiga o sobrecarga. Dame 3 puntos fuertes, 3 aspectos a mejorar y recomendaciones concretas para la próxima semana.`);
  } else if(t==='plan'){
    out.push(`Diseña un plan de entrenamiento para las próximas ${st.coachWeeks} semanas, con ${st.coachDays} días de entrenamiento por semana, orientado a mis objetivos y adaptado a mi nivel actual según los datos. Preséntalo en una tabla por semana y día; para cada sesión indica tipo, duración o distancia, ritmo objetivo (min/km) y zona de FC. Incluye la progresión, días de descanso y una semana de descarga si procede, y explica brevemente la lógica del plan.`);
  } else if(t==='actividad'){
    const a = S.activities.find(x => x.id===st.coachAct) || L[L.length-1];
    out.push('Analiza en detalle esta actividad en el contexto de mi historial: qué salió bien, qué indica sobre mi forma, si la intensidad fue la adecuada y qué haría distinto la próxima vez.', '', 'Actividad (todas las métricas):', coachLine(a, allKeys));
    const ser = (S.series||[]).find(x => x.actId===a.id);
    if(ser) out.push(...seriesCoachLines(ser), 'Analiza también las series una a una: si mantuve el ritmo, cómo evolucionó la FC entre series (deriva cardiaca) y si el tiempo en cada zona encaja con el objetivo de la sesión.');
  } else if(t==='comparar'){
    const sel = st.compareIds.map(id => S.activities.find(a => a.id===id)).filter(Boolean);
    if(sel.length<2) out.push('(Aviso: no hay actividades seleccionadas en «Comparar → Actividad vs actividad». Selecciona al menos 2 y vuelve aquí.)');
    else out.push('Compara estas actividades: diferencias de rendimiento, esfuerzo y técnica de carrera, qué explica las diferencias y qué conclusiones prácticas saco.', '', 'Actividades a comparar (todas las métricas):', ...sel.map(a => coachLine(a, allKeys)));
  } else if(t==='objetivos'){
    out.push((st.goals.length || (st.races||[]).length) ? 'Evalúa uno por uno si voy bien encaminado hacia mis objetivos, qué probabilidad realista tengo de cumplirlos en el plazo con mi tendencia actual y qué debería cambiar para conseguirlos. Si algún objetivo te parece poco realista o demasiado fácil, dímelo y propón uno mejor.' : 'Todavía no tengo objetivos definidos. Según mis datos, propónme 3 objetivos realistas y medibles para las próximas 4-8 semanas y explica por qué.');
  } else {
    out.push(st.coachQ.trim() ? 'Mi pregunta: '+st.coachQ.trim() : '(Escribe tu pregunta en el cuadro «Tu pregunta» del panel.)');
  }
  out.push('', 'Formato: empieza con un resumen de 2-3 líneas, después el detalle con apartados claros. Usa ritmos en min/km y FC en ppm. Es orientación general, no consejo médico: si ves algo preocupante (por ejemplo FC anormalmente alta o señales de lesión), recomiéndame consultar a un profesional.');
  return out.join('\n');
}

async function copyCoachPrompt(ai){

    }
    else if(t.id==='r-type') setRaceType(t.value);
    else if(t.id==='in-maxhr'){ const v = parseInt(t.value,10); if(v>=100 && v<=240){ st.maxHR = v; save(); render(); } else toast('Introduce una FC máxima entre 100 y 240 ppm.'); }
    else if(t.id==='g-metric'){ const m = S.meta[t.value]; if(m){ $('#g-dir').value = m.b===-1 ? '<=' : '>='; $('#g-agg').value = m.add ? 'sum' : 'avg'; } syncGoalAgg(); }
  });
  main.addEventListener('input', e => {
    if(e.target.id==='t-search'){ S.settings.search = e.target.value; save(); renderTableBody(); }
    else if(e.target.id==='cmp-search') renderCmpList();
    else if(e.target.id==='co-about'){ S.settings.coachAbout = e.target.value; save(); updateCoachPrompt(); }
    else if(e.target.id==='co-q'){ S.settings.coachQ = e.target.value; save(); updateCoachPrompt(); }
    else if(e.target.id==='co-prompt') $('#co-count').textContent = '· '+e.target.value.length.toLocaleString('es-ES')+' caracteres';
  });
  main.addEventListener('submit', e => {
    if(e.target.id==='race-form'){ e.preventDefault(); saveRace(); return; }
    if(e.target.id!=='goal-form') return; e.preventDefault();
    const metric = $('#g-metric').value, target = parseTarget(metric, $('#g-target').value.trim());
    if(target==null){ toast('No entiendo el valor objetivo. Usa un número, o m:ss / h:mm:ss para ritmos y tiempos.'); $('#g-target').focus(); return; }
    const start = $('#g-start').value, end = $('#g-end').value;
    if(start && end && start>end){ toast('La fecha «Desde» es posterior a «Hasta».'); return; }
    const g = {id: $('#g-id').value || ('g'+Date.now()), name: $('#g-name').value.trim() || 'Objetivo', metric, agg: metric==='__count' ? 'count' : $('#g-agg').value,
      period: $('#g-period').value, sport: $('#g-sport').value, dir: $('#g-dir').value, target, start, end};
    const i = S.settings.goals.findIndex(x => x.id===g.id);
    if(i>=0) S.settings.goals[i] = g; else S.settings.goals.push(g);
    save(); render(); toast('Objetivo guardado.');
  });
}
function resetFilters(){ Object.assign(S.settings, {sport:'__all', from:'', to:''}); save(); render(); }

/* ---------------- Inicio ---------------- */
bind();
if(load() && S.activities.length) setTimeout(() => toast('Sesión restaurada: '+S.activities.length+' actividades, objetivos y ajustes.'), 300);
render();

/* ---------------- Calendario (semana de lunes a domingo) ----------------
   Sustituye el calendario del navegador en TODOS los campos de fecha del panel.
   El campo sigue guardando la fecha igual (AAAA-MM-DD) y se puede seguir escribiendo a mano. */
(function(){
  const DOW = ['L','M','X','J','V','S','D'], DOWL = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
  const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const parse = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; };
  let pop = null, inp = null, view = null;

  function close(back){
    if(!pop) return;
    pop.remove(); pop = null;
    document.removeEventListener('mousedown', outside, true);
    if(back && inp && inp.isConnected) inp.focus();
    inp = null;
  }
  function outside(e){ if(pop && !pop.contains(e.target) && e.target !== inp) close(false); }
  function pick(v){
    const i = inp; i.value = v;
    i.dispatchEvent(new Event('input', {bubbles:true}));
    i.dispatchEvent(new Event('change', {bubbles:true}));
    close(true);
  }
  function draw(focusIso){
    const sel = inp.value, today = iso(new Date()), min = inp.min || '', max = inp.max || '';
    const y = view.getFullYear(), m = view.getMonth();
    const first = new Date(y, m, 1), start = new Date(y, m, 1 - ((first.getDay()+6) % 7)); // retrocede hasta el lunes
    const title = first.toLocaleDateString('es-ES', {month:'long', year:'numeric'});
    let h = `<div class="dp-head"><button type="button" data-nav="-1" aria-label="Mes anterior">‹</button><strong aria-live="polite">${title}</strong><button type="button" data-nav="1" aria-label="Mes siguiente">›</button></div><div class="dp-grid">`;
    h += DOW.map((d,i) => `<span class="dow" title="${DOWL[i]}" aria-hidden="true">${d}</span>`).join('');
    for(let k = 0; k < 42; k++){
      const d = new Date(start); d.setDate(start.getDate()+k);
      if(k === 35 && d.getMonth() !== m) break; // 5 filas si el mes cabe
      const v = iso(d), dis = (min && v < min) || (max && v > max);
      const cls = [d.getMonth() !== m ? 'out' : '', v === today ? 'today' : '', v === sel ? 'sel' : ''].join(' ').trim();
      const lab = d.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
      h += `<button type="button" class="${cls}" data-d="${v}" tabindex="-1"${dis ? ' disabled' : ''} aria-label="${lab}"${v === sel ? ' aria-pressed="true"' : ''}>${d.getDate()}</button>`;
    }
    h += `</div><div class="dp-foot"><button type="button" data-act="today">Hoy</button><button type="button" data-act="clear">Borrar</button></div>`;
    pop.innerHTML = h;
    const f = (focusIso && pop.querySelector(`[data-d="${focusIso}"]`)) || pop.querySelector('[data-d].sel') || pop.querySelector('[data-d]:not(.out)');
    if(f) f.tabIndex = 0;
    return f;
  }
  function open(i, kb){
    if(pop && inp === i) return;
    close(false); inp = i;
    const cur = parse(i.value) || new Date();
    view = new Date(cur.getFullYear(), cur.getMonth(), 1);
    pop = document.createElement('div');
    pop.className = 'dp'; pop.setAttribute('role', 'dialog');
    pop.setAttribute('aria-label', 'Elegir fecha (semana de lunes a domingo)');
    document.body.appendChild(pop);
    const f = draw(iso(cur));
    const r = i.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    let left = r.left + scrollX;
    if(left + pop.offsetWidth > scrollX + vw - 8) left = Math.max(scrollX + 8, scrollX + vw - pop.offsetWidth - 8);
    pop.style.left = left + 'px'; pop.style.top = (r.bottom + scrollY + 4) + 'px';
    pop.addEventListener('click', onClick);
    pop.addEventListener('keydown', onKey);
    document.addEventListener('mousedown', outside, true);
    if(kb && f) f.focus();
  }
  function onClick(e){
    const b = e.target.closest('button'); if(!b || b.disabled) return;
    if(b.dataset.nav){ view.setMonth(view.getMonth() + Number(b.dataset.nav)); draw(); return; }
    if(b.dataset.d){ pick(b.dataset.d); return; }
    if(b.dataset.act === 'today') pick(iso(new Date()));
    else if(b.dataset.act === 'clear') pick('');
  }
  function onKey(e){
    if(e.key === 'Escape'){ e.preventDefault(); close(true); return; }
    const b = e.target.closest('[data-d]'); if(!b) return;
    const step = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7}[e.key]; if(!step) return;
    e.preventDefault();
    const d = parse(b.dataset.d); d.setDate(d.getDate()+step);
    if(d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()) view = new Date(d.getFullYear(), d.getMonth(), 1);
    const f = draw(iso(d)); if(f) f.focus();
  }
  // Un clic en cualquier campo de fecha abre este calendario en vez del del navegador.
  document.addEventListener('click', e => {
    const i = e.target.closest && e.target.closest('input[type=date]');
    if(!i || i.disabled || i.readOnly) return;
    e.preventDefault(); open(i, false);
  }, true);
  // Teclado: Alt+↓ o F4 abren el calendario; Tab o Esc lo cierran.
  document.addEventListener('keydown', e => {
    const i = e.target;
    if(!(i instanceof HTMLInputElement) || i.type !== 'date') return;
    if((e.altKey && e.key === 'ArrowDown') || e.key === 'F4'){ e.preventDefault(); open(i, true); }
    else if(e.key === 'Escape' || e.key === 'Tab') close(false);
  }, true);
  addEventListener('resize', () => close(false));
})();
</script>
